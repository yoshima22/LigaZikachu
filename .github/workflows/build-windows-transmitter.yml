name: Build Windows Transmitter Beta

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-transmitter/**'
      - '.github/workflows/build-windows-transmitter.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file executable
        shell: pwsh
        run: dotnet publish windows-transmitter/LigaZikachuTransmissor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o output/windows-transmitter
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: windows-transmitter/discord-screen-host/package-lock.json
      - name: Prepare portable bundle
        shell: pwsh
        run: |
          $bundle = "output/LigaZikachuTransmissor"
          $module = "$bundle/Modules/DiscordScreen"
          New-Item -ItemType Directory -Force -Path $module,"$bundle/Runtime/Node","$module/.cache" | Out-Null
          Copy-Item output/windows-transmitter/LigaZikachuTransmissor.exe "$bundle/LigaZikachuTransmissor.exe"
          $source = (Resolve-Path "windows-transmitter/discord-screen-host").Path
          & robocopy $source $module /E /R:2 /W:2 /XD "$source/node_modules" "$source/client/node_modules" /XF ".env"
          if ($LASTEXITCODE -ge 8) { throw "Falha ao copiar o módulo Discord Screen (robocopy $LASTEXITCODE)." }
          $global:LASTEXITCODE = 0
          npm install dotenv@16.4.7 express@4.21.2 ws@8.18.0 --prefix "$module/server" --workspaces=false --omit=dev --ignore-scripts --no-audit --no-fund --package-lock=false
          # As páginas de server/public faltaram no pacote por um release inteiro
          # sem quebrar nada de forma visível: sem elas o catch-all devolve a
          # Activity no lugar da página de captura, com status 200 e título
          # errado. Falhar aqui é a única forma de isso não passar de novo.
          foreach ($obrigatorio in "scripts/start-fast.mjs","client/dist/index.html","server/index.js","server/public/share.html","server/public/share.js","server/public/termos.html","server/public/privacidade.html") {
            if (-not (Test-Path "$module/$obrigatorio")) { throw "O pacote portátil saiu sem $obrigatorio." }
          }
      - name: Include Node and Cloudflare Tunnel
        shell: pwsh
        run: |
          $bundle = "output/LigaZikachuTransmissor"
          $module = "$bundle/Modules/DiscordScreen"
          Copy-Item (Get-Command node).Source "$bundle/Runtime/Node/node.exe"
          curl.exe -L --fail --retry 4 --retry-delay 3 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o "$module/.cache/cloudflared.exe"
          if ((Get-Item "$module/.cache/cloudflared.exe").Length -lt 10MB) { throw "Download do cloudflared está incompleto." }
      - name: Compress complete transmitter
        shell: pwsh
        run: |
          $bundle = "output/LigaZikachuTransmissor"
          Compress-Archive -Path "$bundle/*" -DestinationPath LigaZikachuTransmissorCompleto.zip -CompressionLevel Optimal
      - name: Publish beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp output/windows-transmitter/LigaZikachuTransmissor.exe LigaZikachuTransmissor.exe
          gh release delete transmitter-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create transmitter-latest LigaZikachuTransmissor.exe LigaZikachuTransmissorCompleto.zip --title "Transmissor Windows da Liga Zikachu" --notes "Pacote completo com transmissão P2P da Zika TV e hospedagem portátil da Activity Discord Screen. Baixe o ZIP completo para usar a hospedagem do Discord sem selecionar pastas ou instalar Node."
