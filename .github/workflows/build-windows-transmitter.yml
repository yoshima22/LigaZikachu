name: Build Windows Transmitter
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-transmitter/**'
      - '.github/workflows/build-windows-transmitter.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native capture
        shell: pwsh
        run: ./windows-transmitter/build-native.ps1
      - name: Publish single-file executable
        shell: pwsh
        run: |
          dotnet publish windows-transmitter/LigaZikachuTransmissor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o output/windows-transmitter
          if ($LASTEXITCODE) { throw 'Publish failed' }
          Compress-Archive -LiteralPath output/windows-transmitter/LigaZikachuTransmissor.exe -DestinationPath LigaZikachuTransmissorCompleto.zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ZikaTV-Windows
          path: output/windows-transmitter/LigaZikachuTransmissor.exe
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp output/windows-transmitter/LigaZikachuTransmissor.exe LigaZikachuTransmissor.exe
          if gh release view transmitter-latest >/dev/null 2>&1; then
            gh release upload transmitter-latest LigaZikachuTransmissor.exe LigaZikachuTransmissorCompleto.zip --clobber
          else
            gh release create transmitter-latest LigaZikachuTransmissor.exe LigaZikachuTransmissorCompleto.zip --title "Transmissor Windows da Liga Zikachu" --notes "Player de Fonte com captura nativa de vídeo e áudio isolado por player. Executável portátil; dados em LocalAppData."
          fi
